<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F6FB0" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)" />
  <rect width="800" height="400" fill="url(#grid)" />
  <circle cx="400" cy="200" r="180" fill="url(#glow)" filter="blur(40px)" />
  
  <!-- Graphic Container -->
  <g transform="translate(400, 160)" text-anchor="middle">
    <!-- Icon Circle -->
    <circle cx="0" cy="0" r="46" fill="#1e293b" stroke="#2F6FB0" stroke-width="2.5" />
    
    <!-- Code / AI Symbol -->
    <path d="M-18,-4 L-28,0 L-18,4 M18,-4 L28,0 L18,4 M-4,14 L4,-14" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Pulse Dots -->
    <circle cx="-55" cy="0" r="3.5" fill="#2F6FB0" />
    <circle cx="55" cy="0" r="3.5" fill="#2F6FB0" />
    
    <!-- Labels -->
    <text x="0" y="75" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5">Project Screenshot / Preview</text>
    <text x="0" y="102" fill="#94a3b8" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" letter-spacing="1">REPLACE WITH YOUR PROJECT IMAGE</text>
  </g>
</svg>
